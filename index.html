        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        const compressImg = (base64, maxWidth = 300, quality = 0.6) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64;
                img.onload = () => {
                    const cvs = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxWidth) { h = (h * maxWidth) / w; w = maxWidth; }
                    cvs.width = w; cvs.height = h;
                    const ctx = cvs.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(cvs.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => resolve(DEFAULT_AVATAR);
            });
        };

        const AddMemberModal = memo(({ onClose, onAdd, handleFileAction }) => {

            const [toast, setToast] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [showAddMember, setShowAddMember] = useState(false);
            const [showMasterConsole, setShowMasterConsole] = useState(false);
            const [deleteConfirm, setDeleteConfirm] = useState(null);
            const [passInput, setPassInput] = useState("");

            const fileRefs = { wechat: useRef(), alipay: useRef(), editAvatar: useRef() };

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (auth) {
                            await signInAnonymously(auth);
                            onAuthStateChanged(auth, setUser);
                        } else setUser({uid: 'local_user'});
                    } catch (e) { setUser({uid: 'local_user'}); }
                };
                initAuth();
            }, []);

            useEffect(() => {
                if (!user || !db) return;
                const configRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'mainConfig');
                const teamColl = collection(db, 'artifacts', appId, 'public', 'data', 'members');
                const unsubConfig = onSnapshot(configRef, (snap) => { if (snap.exists()) setConfig(p => ({ ...INITIAL_CONFIG, ...snap.data() })); });
                const unsubTeam = onSnapshot(teamColl, (snap) => { setTeam(snap.docs.map(d => ({ id: d.id, ...d.data() }))); });
                return () => { unsubConfig(); unsubTeam(); };
            }, [user]);

            const handleLogin = (e) => { e.preventDefault(); if (passInput === ADMIN_PASSWORD) { setIsAdmin(true); setShowLogin(false); setPassInput(""); setToast({ message: "管理员认证成功", type: "success" }); } else setToast({ message: "密钥错误", type: "error" }); };
            const commitMemberChange = useCallback(async (pId, updates) => {
                if (!db) { setTeam(prev => prev.map(item => item.id === pId ? {...item, ...updates} : item)); return; }
                try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members', pId), updates); } catch(e) { setToast({message:"同步失败", type:"error"}); }
            }, [user]);

            const handleAddNewMember = useCallback(async (form) => {
                if (!db) { setTeam(prev => [...prev, {...form, id: Date.now().toString()}]); setShowAddMember(false); return; }
                try { await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'members'), form); setShowAddMember(false); setToast({message: "入库成功", type: "success"}); } catch(e) { setToast({message: "同步失败", type: "error"}); }
            }, [user]);

            const handleFileAction = (e, callback) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onloadend = () => { callback(reader.result); e.target.value = ""; }; reader.readAsDataURL(file); };
            const handleUpdateAvatar = async (res) => { const compressed = await compressImg(res); commitMemberChange(selectedPerson.id, {photo: compressed}); setSelectedPerson(p => ({...p, photo: compressed})); };

            const filteredTeam = useMemo(() => {
                const s = searchTerm.toLowerCase();
                let filtered = team;
                if(teamFilter !== 'all') filtered = filtered.filter(m => m.category === teamFilter);
                if(s) filtered = filtered.filter(m => (m.name || "").toLowerCase().includes(s));
                return filtered;
            }, [team, searchTerm, teamFilter]);

            const saveConfigToCloud = async (nc) => {
                if(!db) { setConfig(nc); return; }
                try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'mainConfig'), nc); setToast({message: "配置同步成功", type: "success"}); } catch (e) { setToast({message: "同步失败", type: "error"}); } 
            }

            return (
                <div className="min-h-screen flex flex-col bg-[#050505] animate-quick-fade font-serif">
                    {viewMode === 'landing' ? (
                        <div className="min-h-screen flex flex-col items-center justify-center text-center p-8 relative bg-[#010101] overflow-hidden">
                            <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(99,102,241,0.04)_0%,transparent_70%)]"></div>
                            <div className="relative z-10 space-y-12">
                                <div className="relative select-none font-shufa text-center">
                                    <h1 className="text-[8rem] md:text-[9rem] text-white tracking-[0.1em] leading-none">汉责</h1>
                                    <div className="absolute -top-6 -right-12 bg-red-900 border-2 border-red-700 p-3 rounded-lg rotate-6 select-none shadow-2xl">
                                        <span className="writing-vertical text-xl text-red-50 tracking-[0.2em]">督学</span>
                                    </div>
                                </div>
                                <div className="space-y-4">
                                    <p className="text-zinc-600 uppercase tracking-[0.8em] text-[8px] font-black italic">{config.landing.subTitle}</p>
                                    <p className="text-zinc-400 max-w-md mx-auto text-sm italic leading-relaxed opacity-70 whitespace-pre-wrap">{config.landing.description}</p>
                                </div>
                                <button onClick={() => setViewMode('main')} className="group px-14 py-4 bg-white text-black rounded-full font-black text-lg hover:scale-105 active:scale-95 transition-all shadow-xl uppercase tracking-widest">{config.landing.enterButton}</button>
                                <p className="text-zinc-900 text-[9px] tracking-[0.4em] font-black uppercase mt-12">{config.landing.footer}</p>
                            </div>
                        </div>
                    ) : (
                        <div className="flex flex-col min-h-screen animate-instant">
                            <header className="sticky top-0 z-50 bg-[#0a0a0c] border-b border-white/5 py-3 px-8 shadow-2xl">
                                <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                                    <div className="flex items-center gap-3">
                                        <Building2 size={20} className="text-indigo-600"/>
                                        <div className="text-left font-shufa select-none">
                                            <h1 className="text-lg font-black tracking-widest uppercase italic">{config.header.title}</h1>
                                            <p className="text-[6px] font-bold text-zinc-700 uppercase tracking-[0.4em] font-serif">{config.header.subtitle}</p>
                                        </div>
                                    </div>
                                    <nav className="flex items-center bg-black/60 p-1.5 rounded-xl border border-white/10">
                                        {['team', 'price'].map(t => (
                                            <button key={t} onClick={() => { setActiveTab(t); setSelectedPerson(null); }} className={`px-5 py-2 rounded-lg text-[8px] font-black uppercase transition-all ${activeTab === t ? 'bg-indigo-600 text-white shadow-lg' : 'text-zinc-600 hover:text-zinc-300'}`}>{t === 'team' ? '团队' : '价格'}</button>
                                        ))}
                                    </nav>
                                    <div className="flex items-center gap-4">
                                        {isAdmin && <button onClick={() => setShowMasterConsole(true)} className="p-2 bg-amber-600/10 text-amber-500 rounded-lg hover:bg-amber-600 hover:text-black transition-all"><Settings size={14}/></button>}
                                        <button onClick={() => setViewMode('landing')} className="text-[9px] font-black text-zinc-700 hover:text-white uppercase transition-all italic">断开</button>
                                        <button onClick={() => isAdmin ? setIsAdmin(false) : setShowLogin(true)} className={`p-2.5 rounded-full border transition-all ${isAdmin ? 'bg-amber-600 text-black border-amber-500' : 'bg-zinc-900 text-zinc-600 border-white/5'}`}><Lock size={14}/></button>
                                    </div>
                                </div>
                            </header>
                            <main className="flex-1 overflow-y-auto pb-32 no-scrollbar">
                                <div className="max-w-7xl mx-auto px-8 py-10">
                                    {activeTab === 'team' ? (
                                        <div className="space-y-10 text-center">
                                            <div className="flex flex-col lg:flex-row justify-between items-end gap-6 font-shufa">
                                                <div className="space-y-2">
                                                    <h2 className="text-5xl font-black text-white italic tracking-tighter uppercase font-serif">监督团队</h2>
                                                    <div className="flex flex-wrap gap-2 justify-center font-serif">
                                                        {CATEGORIES.map(cat => (
                                                            <button key={cat.id} onClick={() => setTeamFilter(cat.id)} className={`px-4 py-2 rounded-xl border border-white/5 text-[8px] font-black uppercase transition-all ${teamFilter === cat.id ? 'active-filter' : 'bg-zinc-900/20 text-zinc-600'}`}>{cat.name}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3 w-full lg:w-auto font-serif">
                                                    <div className="relative flex-1 lg:w-64 shadow-xl">
                                                        <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-700" size={12}/>
                                                        <input type="text" placeholder="全域检索..." className="w-full bg-zinc-900 border border-white/5 rounded-xl py-3 pl-8 pr-4 text-xs text-white outline-none italic" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                                                    </div>
                                                    {isAdmin && <button onClick={() => setShowAddMember(true)} className="p-3 bg-indigo-600 text-white rounded-xl shadow-lg"><Plus size={18}/></button>}
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                {filteredTeam.length > 0 ? filteredTeam.map((p) => (
                                                    <MemberCard key={p.id} person={p} isAdmin={isAdmin} onSelect={setSelectedPerson} onDelete={setDeleteConfirm} />
                                                )) : <div className="col-span-full py-20 text-zinc-600 text-sm">暂无团队成员数据</div>}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="space-y-16 text-center animate-instant font-shufa">
                                            <h2 className="text-5xl font-black text-white tracking-[0.2em]">价格列表</h2>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-5xl mx-auto font-serif">
                                                {config.pricing.categories.map(cat => (
                                                    <div key={cat.id} className="std-card rounded-[2.5rem] overflow-hidden shadow-2xl">
                                                        <div className="p-5 bg-white/[0.02] font-black text-white text-base border-b border-white/5 uppercase italic font-shufa">{cat.name}</div>
                                                        <div className="p-6 space-y-6">
                                                            {cat.options.map((opt, i) => (
                                                                <div key={i} className="p-8 rounded-[1.5rem] bg-black/40 border border-white/5 hover:bg-black/60 transition-all">
                                                                    <div className="flex flex-col items-center gap-2 mb-6">
                                                                        <div className="px-3 py-0.5 bg-indigo-900/30 text-indigo-400 text-[8px] font-black rounded uppercase">监督合约</div>
                                                                        <span className="text-3xl text-white font-black">￥{opt.price}<span className="text-[10px] text-zinc-700 ml-1">/ {opt.unit}</span></span>
                                                                    </div>
                                                                    <button onClick={() => setSelectedService({ catName: cat.name, opt })} className="w-full py-3 bg-white text-black rounded-xl font-black text-[10px] active:scale-95 shadow-xl font-serif uppercase">激活结算终端</button>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </main>
                        </div>
                    )}

                    <div id="interaction-portals">
                        {selectedPerson && (
                            <div className="fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[800] animate-instant" onClick={() => setSelectedPerson(null)}>
                                <div className={`w-full max-w-4xl rounded-[3rem] flex flex-col md:flex-row overflow-hidden shadow-2xl standard-glass ${selectedPerson.category === 'boss' ? 'boss-card-bg' : 'strict-card-bg'}`} onClick={e => e.stopPropagation()}>
                                    <div className="md:w-[42%] p-8 bg-black/70 flex flex-col items-center border-r border-white/5 relative font-serif">
                                        <div className="relative mb-6 rounded-2xl overflow-hidden border-4 border-white/10 group cursor-pointer" onClick={() => isAdmin && fileRefs.editAvatar.current.click()}>
                                            <img src={selectedPerson.photo || DEFAULT_AVATAR} className="w-40 h-40 md:w-56 md:h-56 object-cover" />
                                            {isAdmin && <div className="absolute inset-0 bg-black/70 flex items-center justify-center text-white opacity-0 hover:opacity-100 transition-opacity"><Camera size={24}/></div>}
                                            <div className="absolute -bottom-3 -right-3 scale-110"><StatusIndicator status={selectedPerson.status}/></div>
                                        </div>
                                        <input ref={fileRefs.editAvatar} type="file" hidden accept="image/*" onChange={(e) => handleFileAction(e, handleUpdateAvatar)} />
                                        <div className="w-full space-y-1 font-shufa text-center">
                                            {isAdmin ? <input className="w-full bg-zinc-900 border border-zinc-800 text-center text-xl font-black rounded-lg py-2 text-white" value={selectedPerson.name} onChange={e => commitMemberChange(selectedPerson.id, {name: e.target.value})} /> : <h2 className="text-3xl font-black text-white italic">{selectedPerson.name}</h2>}
                                            <p className="text-zinc-600 text-[9px] font-black uppercase tracking-[0.3em] font-serif">{selectedPerson.role || '资深督导'}</p>
                                        </div>
                                        <button onClick={() => { setActiveTab('price'); setSelectedPerson(null); }} className="mt-8 w-full py-4 bg-white text-black rounded-xl font-black text-xs active:scale-95 shadow-xl font-serif uppercase tracking-widest">立即签署契约</button>
                                    </div>
                                    <div className="md:w-[58%] p-10 bg-black/20 overflow-y-auto no-scrollbar relative font-serif">
                                        <button onClick={() => setSelectedPerson(null)} className="absolute top-6 right-6 text-zinc-700 hover:text-white font-serif"><X /></button>
                                        <div className="space-y-8 font-serif leading-relaxed text-center">
                                            <h3 className="text-[10px] font-black uppercase text-indigo-600 tracking-[0.5em]">详细档案记录</h3>
                                            <div className="bg-white/[0.02] p-10 rounded-[3rem] border border-white/5 text-zinc-300 min-h-[120px] font-serif">
                                                {isAdmin ? <textarea className="w-full bg-transparent text-sm h-32 outline-none resize-none font-serif text-center" value={selectedPerson.bio || '专注督导服务，助力高效自律'} onChange={e => commitMemberChange(selectedPerson.id, {bio: e.target.value})} /> : <p className="text-sm italic">“ {selectedPerson.bio || '专注督导服务，助力高效自律'} ”</p>}
                                            </div>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="p-6 rounded-2xl bg-zinc-900/60 flex flex-col gap-3 items-center border border-white/5"><ShieldCheck size={32} className="text-indigo-600"/><p className="text-[8px] font-black text-white uppercase">隐私保护</p></div>
                                                <div className="p-6 rounded-2xl bg-zinc-900/60 flex flex-col gap-3 items-center border border-white/5"><Zap size={32} className="text-amber-500"/><p className="text-[8px] font-black text-white uppercase">极速响应</p></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {selectedService && (
                            <div className="fixed inset-0 bg-black/95 flex items-center justify-center p-6 z-[20000] animate-quick-fade" onClick={() => setSelectedService(null)}>
                                <div className="bg-zinc-950 w-full max-w-lg rounded-[3.5rem] p-10 text-center space-y-10 border border-indigo-600/20 shadow-2xl" onClick={e => e.stopPropagation()}>
                                    <div className="space-y-2 font-shufa">
                                        <h3 className="text-3xl font-black text-white uppercase">支付中心</h3>
                                        <p className="text-zinc-600 text-[10px] font-bold tracking-widest uppercase font-serif">加密结算通道</p>
                                    </div>
                                    <div className="bg-black/90 p-8 rounded-[2.5rem] border border-white/5 font-serif">
                                        <div className="grid grid-cols-2 gap-6 mb-8">
                                            {['wechatQr', 'alipayQr'].map(t => (
                                                <div key={t} className="space-y-4 group">
                                                    <div className="bg-white p-2 rounded-2xl aspect-square flex items-center justify-center shadow-xl overflow-hidden border-4 border-white/10">
                                                        {config?.payment?.[t] ? <img src={config.payment[t]} className="w-full h-full object-contain" /> : <QrCode size={40} className="text-zinc-200"/>}
                                                    </div>
                                                    <p className="text-[10px] font-black text-zinc-500 uppercase">{t.includes('wechat')?'微信':'支付宝'}</p>
                                                </div>
                                            ))}
                                        </div>
                                        <p className="text-[9px] text-zinc-600 font-black italic tracking-widest opacity-60">支付后保存截图激活正式契约</p>
                                    </div>
                                    <button onClick={() => setSelectedService(null)} className="text-[10px] font-black text-zinc-800 hover:text-white transition-all uppercase tracking-[0.5em] italic font-shufa">关闭支付窗口</button>
                                </div>
                            </div>
                        )}

                        {showLogin && (
                            <div className="fixed inset-0 bg-black/99 flex items-center justify-center p-8 z-[10000] animate-quick-fade" onClick={() => setShowLogin(false)}>
                                <div className="w-full max-w-xs p-10 bg-[#0a0a0c] border border-white/5 rounded-[2rem] space-y-10 text-center shadow-2xl font-serif" onClick={e => e.stopPropagation()}>
                                    <div className="space-y-4 font-shufa">
                                        <ShieldAlert size={40} className="text-indigo-600 mx-auto"/>
                                        <h2 className="text-lg font-black uppercase text-white tracking-[0.2em]">管理员授权</h2>
                                    </div>
                                    <form onSubmit={handleLogin} className="space-y-6">
                                        <input type="password" className="w-full bg-black/80 border border-white/10 rounded-xl py-4 text-center outline-none text-white tracking-[1em] focus:border-indigo-600 text-sm font-serif shadow-inner" placeholder="••••" value={passInput} onChange={e => setPassInput(e.target.value)} autoFocus />
                                        <button className="w-full py-4 bg-white text-black rounded-xl font-black uppercase shadow-xl text-[10px]">授权并进入</button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {deleteConfirm && (
                            <div className="fixed inset-0 bg-black/98 flex items-center justify-center p-8 z-[12000] animate-quick-fade font-serif">
                                <div className="bg-zinc-950 border border-red-900/30 w-full max-w-xs p-8 rounded-[2rem] text-center space-y-6 font-shufa shadow-2xl">
                                    <AlertTriangle size={40} className="text-red-700 mx-auto animate-pulse"/>
                                    <div className="space-y-2 font-serif">
                                        <h3>确认销毁？</h3>
                                        <p className="text-[9px] text-zinc-700 uppercase">数据从云端永久移除</p>
                                    </div>
                                    <div className="flex flex-col gap-3 font-serif">
                                        <button onClick={async () => {
                                            if(!db) { setTeam(prev => prev.filter(item => item.id !== deleteConfirm)); setDeleteConfirm(null); return; }
                                            try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members', deleteConfirm)); setDeleteConfirm(null); setToast({message: "销毁成功", type: "success"}); } catch(e) { setToast({message:"删除失败", type:"error"}); }
                                        }} className="w-full py-4 bg-red-600 text-white rounded-xl font-black text-[10px] active:scale-95 transition-all font-serif">确认销毁</button>
                                        <button onClick={() => setDeleteConfirm(null)} className="text-[10px] font-black text-zinc-700 hover:text-white transition-all uppercase">中止</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showMasterConsole && (
                            <MasterConsoleModal config={config} setConfig={setConfig} onClose={() => setShowMasterConsole(false)} saveConfigToCloud={saveConfigToCloud} handleFileAction={handleFileAction} />
                        )}
                        {showAddMember && (
                            <AddMemberModal onClose={() => setShowAddMember(false)} onAdd={handleAddNewMember} handleFileAction={handleFileAction} />
                        )}
                    </div>

                    {toast && <ToastComp msg={toast} onClose={() => setToast(null)} />}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);

        (function() {
            const loader = document.getElementById('initial-loader');
            if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.style.display = 'none', 300); }
        })();
    </script>
</body>
</html>
